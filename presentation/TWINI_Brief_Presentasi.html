<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWINI — Brief Materi Digital Twin</title>
<style>
:root{--bg:#07111e;--panel:#122338;--panel2:#172d46;--ink:#f0f6fc;--muted:#adc0d3;--blue:#74c6ff;--mint:#7be0c0;--gold:#ffd178;--purple:#c9a8ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
.deck{width:100vw;height:100vh;position:relative}.slide{display:none;position:absolute;inset:0;padding:5.1vh 5.4vw 6vh;overflow:auto;background:radial-gradient(ellipse at 85% 5%,#142c46 0,transparent 40%),linear-gradient(145deg,#081321,#0b1726 65%,#0b1b2d)}.slide.active{display:flex;flex-direction:column}.eyebrow{color:var(--blue);font-size:clamp(10px,1vw,15px);font-weight:800;letter-spacing:.16em;text-transform:uppercase}.title{font-size:clamp(28px,4vw,54px);line-height:1.05;letter-spacing:-.035em;margin:12px 0 20px;max-width:1050px}.subtitle{font-size:clamp(15px,1.55vw,22px);color:var(--muted);line-height:1.45;max-width:880px}.footer{position:absolute;left:5.4vw;right:5.4vw;bottom:2vh;display:flex;justify-content:space-between;color:#70869d;font-size:11px;letter-spacing:.08em}.content{flex:1;min-height:0;display:flex;gap:4vw;align-items:center}.copy{flex:1;min-width:0}.copy h3{font-size:clamp(18px,2vw,28px);margin:0 0 14px;color:var(--blue)}.copy p,.copy li{font-size:clamp(14px,1.45vw,20px);line-height:1.55;color:var(--muted)}.copy ul{padding-left:1.2em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.card{background:linear-gradient(145deg,rgba(24,45,69,.94),rgba(16,32,50,.94));border:1px solid rgba(158,194,228,.18);border-radius:18px;padding:18px 19px;min-height:92px}.card b{display:block;color:var(--mint);font-size:clamp(14px,1.25vw,18px);margin-bottom:6px}.card span{display:block;color:var(--muted);font-size:clamp(13px,1.12vw,16px);line-height:1.42}.visual{width:min(34vw,360px);height:min(69vh,690px);flex:0 0 auto;border-radius:28px;padding:8px;background:#081321;border:1px solid rgba(168,206,241,.4);box-shadow:0 24px 70px rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center}.visual img{width:100%;height:100%;object-fit:contain;border-radius:22px}.note{font-size:11px!important;color:var(--gold)!important;letter-spacing:.04em;margin-top:9px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}.step{position:relative;border-radius:22px;padding:25px;background:var(--panel);border:1px solid rgba(125,190,236,.25);min-height:170px}.step .num{font-size:13px;color:var(--gold);letter-spacing:.1em;font-weight:800}.step h3{margin:15px 0 8px;font-size:clamp(19px,2vw,28px)}.step p{margin:0;color:var(--muted);font-size:clamp(14px,1.3vw,18px);line-height:1.45}.step:not(:last-child):after{content:'→';position:absolute;right:-25px;top:40%;font-size:30px;color:var(--gold);z-index:2}.callout{border-left:4px solid var(--blue);background:rgba(56,107,149,.16);padding:16px 20px;border-radius:0 14px 14px 0;color:#deefff;font-size:clamp(14px,1.25vw,18px);line-height:1.45;margin-top:18px}.cover{justify-content:center}.cover .title{font-size:clamp(44px,7vw,92px);max-width:900px;margin:20px 0}.cover .subtitle{font-size:clamp(19px,2.2vw,30px)}.covermark{display:flex;align-items:center;gap:12px;color:var(--mint);font-weight:800;letter-spacing:.2em}.covermark i{width:42px;height:3px;background:var(--mint)}.coverchips{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}.coverchips span{border:1px solid #34536d;border-radius:99px;padding:10px 15px;color:#d6e8f7;background:rgba(22,42,64,.65);font-size:14px}.controls{position:fixed;z-index:10;right:3vw;bottom:2.2vh;display:flex;gap:8px}.controls button{width:42px;height:42px;border-radius:50%;border:1px solid #45627d;background:#14263a;color:#eaf5ff;font-size:19px;cursor:pointer}.counter{position:fixed;right:3vw;top:2.4vh;color:#94abc1;font-size:12px;letter-spacing:.1em}.diagram{display:flex;align-items:stretch;gap:25px;margin:28px 0}.node{flex:1;padding:22px;border-radius:18px;background:var(--panel);border:1px solid #3c5c78}.node b{display:block;font-size:21px;margin-bottom:10px;color:var(--blue)}.node span{font-size:16px;line-height:1.5;color:var(--muted)}.arrow{align-self:center;color:var(--gold);font-size:30px}.small{font-size:13px!important}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}.label{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px}
@media(max-width:800px){.slide{padding:4vh 5vw 8vh}.content{align-items:flex-start;gap:18px}.visual{width:34vw;height:54vh}.grid{grid-template-columns:1fr;gap:8px}.card{padding:12px;min-height:0}.flow,.diagram{gap:8px}.step{padding:15px}.step:not(:last-child):after{right:-15px}.copy p,.copy li{font-size:14px}}
@media print{html,body{overflow:visible;background:#07111e}.slide{display:flex!important;position:relative;page-break-after:always;height:100vh}.controls,.counter{display:none}}
</style>
</head>
<body>
<main class="deck" id="deck"></main><div class="counter" id="counter"></div><div class="controls"><button aria-label="Sebelumnya" onclick="move(-1)">‹</button><button aria-label="Berikutnya" onclick="move(1)">›</button></div>
<script>
const slides=[
{type:'cover',eyebrow:'INDONESIA DIGITAL TWIN COMMUNITY',title:'TWINI',subtitle:'Belajar Digital Twin melalui eksplorasi kota, karakter 3D, dan simulasi sensor.',chips:['Paparan materi','Digital Twin','Game edukasi','Monas · Jakarta']},
{title:'Tujuan pembelajaran',intro:'Setelah sesi, peserta diharapkan memahami bagaimana objek, data, aturan, dan tindakan disusun dalam skenario Digital Twin.',cards:[['Pahami representasi','Bedakan objek kota fisik dan representasi digitalnya.'],['Amati state','Baca perubahan posisi, status sensor, resource, dan progres.'],['Uji skenario','Jelajahi rute dan interaksi untuk melihat respons model.'],['Nilai kualitas','Identifikasi data contoh, asumsi, serta data yang dibutuhkan untuk validasi.']]},
{title:'Digital Twin dalam konteks TWINI',flow:[['01 · KOTA FISIK','Monas, taman, landmark, dan perangkat kota menjadi konteks skenario.'],['02 · MODEL DIGITAL','Scene 3D menampung objek, koordinat, status, resource, dan aturan.'],['03 · INTERAKSI','Pemain bergerak, menemukan landmark, mengaktifkan sensor, lalu membaca umpan balik.']],callout:'TWINI saat ini adalah prototipe edukasi: telemetri dashboard merupakan data simulasi, bukan feed sensor live.'},
{title:'Apa yang dimodelkan?',cards:[['Entitas spasial','Monas, Medan Merdeka, Gambir, Museum Nasional, Istiqlal, gedung, taman, lampu, bangku.'],['Aktor','Karakter Twini dan pilihan model GLB sebagai avatar yang bergerak dalam scene.'],['Perangkat','Sensor simulasi untuk banjir/drainase, kualitas udara, dan energi.'],['State','Posisi pemain, sensor standby/aktif, landmark ditemukan, inventori, health, energy, battery.'],['Aturan','Jarak interaksi, batas peta, waktu bertahan, kebutuhan energi dan stamina.'],['Event','Temukan landmark, aktifkan sensor, kumpulkan crystal, gunakan item, klaim misi.']]},
{title:'Alur sesi simulasi',flow:[['PILIH','Pilih karakter GLB dan mulai dari menu TWINI.'],['JELAJAHI','Gunakan joystick untuk bergerak di sekitar Monas dan cari landmark.'],['INTERVENSI','Aktifkan sensor, ambil energy crystal, pantau resource dan misi.']],cards:[['Amati','Perhatikan HUD, mini-map, status sensor, dan timer.'],['Bandingkan','Ulangi tindakan melalui rute atau urutan berbeda.'],['Refleksikan','Hubungkan event dengan state model dan umpan balik.']]},
{title:'Home dan navigasi aplikasi',image:'screenshots/home_dashboard_actual.png',actual:true,note:'Screenshot aktual dari web preview. Layar lain di bagian berikut diberi label ilustrasi UI.',cards:[['Home','Carousel model GLB, tagline, Explore models, dan akses cepat.'],['Explore','Penjelajah kategori objek 3D.'],['TWINI','Game Digital Twin Survival.'],['Simulasi','Ruang kerja proyek simulasi.'],['Profil','Akun dan koleksi model.']]},
{title:'TWINI Survival · menu permainan',image:'screenshots/twini_menu.png',cards:[['Mulai Eksplorasi','Memulai sesi pada kawasan Monas.'],['Pilih karakter','Twini-IDTC, Dani-01, atau Dani-02.'],['Aktivitas','Mission Center, Inventory, Digital Twin Dashboard, City Builder, OpenStreetMap.']],callout:'Ilustrasi screen disusun dari struktur UI source code; bukan capture simulator.'},
{title:'Gameplay · bergerak dan berinteraksi',image:'screenshots/gameplay.png',cards:[['Joystick','Memindahkan avatar; gerak memicu animasi berjalan, dilepas memicu mode diam.'],['Run / Jump / Interact','Kontrol untuk sprint, lompatan, dan interaksi dengan objek dekat.'],['Scene','Scene 3D menampilkan Monas, taman, gedung, landmark, lampu, dan sensor.'],['HUD','Mini-map, lokasi, timer, misi, dan bar resource memberi umpan balik.']],callout:'Scene dan angka pada ilustrasi hanya menjelaskan tata letak; bukan data operasional.'},
{title:'Karakter GLB · representasi aktor',image:'screenshots/characters.png',cards:[['Twini - IDTC','Karakter default dengan rig dan animasi.'],['Dani-01 / Dani-02','Alternatif model GLB yang dapat dipilih.'],['Pergantian saat bermain','Tombol Pengaturan berbentuk roda gigi membuka pemilihan karakter tanpa keluar dari sesi.'],['Peran pembelajaran','Avatar dapat dianalogikan sebagai pengguna/operator yang melakukan aksi di lingkungan digital.']]},
{title:'Misi · progres · reward',image:'screenshots/missions.png',cards:[['First Arrival','Memulai perjalanan di kawasan Monas.'],['Digital Explorer','Menemukan lima landmark.'],['Energy Hunter','Mengumpulkan Energy Crystal.'],['Smart City Guardian','Mengaktifkan tiga sensor simulasi.'],['Urban Survivor / Digital Core','Bertahan 10 menit dan mengaktifkan core.']],callout:'XP dan koin adalah gamifikasi; bukan indikator kinerja kota.'},
{title:'Inventory dan resource',image:'screenshots/inventory.png',cards:[['Health','Kondisi karakter selama permainan.'],['Energy · stamina · battery','Membatasi aktivitas serta memberi trade-off dalam eksplorasi.'],['Energy Crystal','Item koleksi yang membantu memulihkan battery.'],['Battery Pack · Health Kit','Item pemulihan untuk energy/battery atau health.']],callout:'Resource permainan tidak merepresentasikan konsumsi energi infrastruktur kota nyata.'},
{title:'Dashboard telemetri simulasi',image:'screenshots/telemetry.png',cards:[['Contoh indikator','Suhu 34°C, kelembapan 72%, AQI 84, angin 11 km/jam.'],['Sensor','Flood & Drainage, Air Quality Monitor, Smart Energy Pole.'],['Status','Sensor dapat berpindah dari standby ke online dalam simulasi.'],['Catatan wajib','Nilai dashboard ditandai sebagai simulasi; bukan pengukuran aktual Jakarta.']],callout:'Untuk penggunaan nyata diperlukan sumber, satuan, lokasi, timestamp, provenance, dan pemeriksaan kualitas data.'},
{title:'Bangun Kota · susun aset dan sensor',image:'screenshots/city_builder.png',cards:[['Grid 20 × 20','Terdiri dari 400 petak untuk rancangan level.'],['Aset kota','Pilih kategori lalu tempatkan objek pada petak yang sesuai.'],['Kelompok sensor','UI menyediakan pilihan perangkat IoT untuk skenario.'],['Monitoring','Sensor yang ditempatkan dapat ditampilkan sebagai status simulasi.']],callout:'Latihan: bandingkan penempatan sensor banjir dengan sensor kualitas udara.'},
{title:'Explore · Library · Viewer',image:'screenshots/library.png',cards:[['Explore','Menelusuri kategori aset digital.'],['GLB Library','Membuka koleksi model 3D, termasuk karakter.'],['Viewer','Pratinjau model secara interaktif.'],['Makna untuk twin','GLB menyediakan visualisasi; akurasi geometri/lokasi tetap perlu divalidasi.']]},
{title:'Explore · kategori objek 3D',image:'screenshots/categories.png',cards:[['Kategori','Membantu menemukan aset berdasarkan jenisnya.'],['Konteks','Bangunan, transportasi, serta infrastruktur kota.'],['Peran di pembelajaran','Kategorisasi aset membantu membangun inventaris model digital.']]},
{title:'3D Viewer · tinjau aset',image:'screenshots/viewer.png',cards:[['Pratinjau','Buka model dari library atau hasil generasi.'],['Interaksi','Rotasi dan zoom membantu pemeriksaan visual.'],['Batas','Pratinjau bukan validasi ukuran, koordinat, atau kecocokan dengan kondisi lapangan.']]},
{title:'Profile · akun dan library pribadi',image:'screenshots/profile.png',cards:[['Profil pengguna','Tampilan informasi akun.'],['My 3D Library','Akses ke model pengguna.'],['Account management','Pengelolaan kredensial dan sesi.']]},
{title:'Onboarding · login · register',image:'screenshots/onboarding.png',cards:[['Splash','Pembuka aplikasi dan branding TWINI.'],['Onboarding','Pengenalan singkat fitur aplikasi.'],['Login','Masuk dengan email dan password.'],['Register','Membuat profil akun pengguna.']],callout:'Ilustrasi onboarding/auth mengikuti struktur screen source code; bukan capture perangkat.'},
{title:'Login dan Register · autentikasi',image:'screenshots/auth.png',cards:[['Login','Masuk dengan email dan password.'],['Register','Membuat akun baru.'],['Keamanan','Gunakan kredensial demo saat presentasi; jangan tampilkan data pribadi.']]},
{title:'Simulasi proyek dan generator AI',image:'screenshots/simulation.png',cards:[['Twin Simulations','Antarmuka untuk mengelola proyek simulasi.'],['Meshy AI','Pembuatan model melalui text-to-3D atau image-to-3D.'],['Aset pendukung','Model hasil generasi dapat menjadi visualisasi setelah ditinjau.'],['Validasi','Periksa skala, geometri, metadata, sumber, dan lisensi.']],callout:'Pembuatan model AI tidak otomatis menghasilkan model Digital Twin yang akurat atau tervalidasi.'},
{title:'Skema data konseptual',flow:[['ENTITAS','landmark · sensor · avatar · item'],['STATE','posisi · status · waktu · resource'],['EVENT','temukan · aktifkan · kumpulkan · gunakan']],cards:[['Identitas','Apa ID unik untuk setiap aset dan sensor?'],['Data','Siapa sumber nilainya dan kapan diperbarui?'],['Aturan','Kondisi apa yang memicu perubahan status?']],callout:'Pertanyaan inti: bagaimana perubahan pada model ditautkan ke data dan aturan yang bisa diperiksa?'},
{title:'Batas prototipe dan integritas data',cards:[['Belum live','Dashboard tidak menerima sensor lapangan secara langsung.'],['Belum terkalibrasi','Scene bukan survei geospasial dengan akurasi ukur yang dinyatakan.'],['Bukan prediksi','Angka tidak berasal dari model prediksi atau risiko tervalidasi.'],['Privasi dan operasi','Prototipe bukan sistem operasi kota maupun representasi warga.'],['Bahasa yang tepat','Pisahkan data contoh, asumsi, hasil simulasi, dan fakta terukur.'],['Nilai edukasi','Game menjadi laboratorium untuk mempelajari struktur dan alur Digital Twin.']]},
{title:'Panduan fasilitator · skenario 10 menit',flow:[['2 MENIT · ORIENTASI','Baca peta, tujuan, landmark, dan status awal.'],['5 MENIT · AKSI','Jelajahi, temukan titik penting, aktifkan sensor, kelola resource.'],['3 MENIT · REFLEKSI','Bandingkan status, diskusikan data yang dibutuhkan di lapangan.']],cards:[['Pertanyaan diskusi','State apa yang berubah? Event apa penyebabnya? Bagaimana perubahan itu divalidasi?']]},
{type:'cover',eyebrow:'RANGKUMAN',title:'Dari game menuju Digital Twin yang dapat dipercaya',subtitle:'Identifikasi entitas · tautkan data · jelaskan aturan · validasi hasil terhadap kondisi nyata.',chips:['TWINI · IDTC','Eksplorasi','Simulasi','Refleksi']}
];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderCard([h,b]){return `<div class="card"><b>${esc(h)}</b><span>${esc(b)}</span></div>`}
function renderFlow([h,b],i){return `<div class="step"><div class="num">${esc(h)}</div><p>${esc(b)}</p></div>`}
const deck=document.getElementById('deck');
for(let i=0;i<slides.length;i++){const s=slides[i];const el=document.createElement('section');el.className='slide'+(i===0?' active':'');
if(s.type==='cover'){el.classList.add('cover');el.innerHTML=`<div class="covermark"><i></i>${esc(s.eyebrow)}</div><h1 class="title">${esc(s.title)}</h1><div class="subtitle">${esc(s.subtitle)}</div><div class="coverchips">${s.chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`}
else{el.innerHTML=`<div class="eyebrow">TWINI · IDTC / BRIEF DIGITAL TWIN</div><h1 class="title">${esc(s.title)}</h1><div class="content">${s.image?`<div class="visual"><img src="${esc(s.image)}" alt="${esc(s.title)}"></div>`:''}<div class="copy">${s.intro?`<p>${esc(s.intro)}</p>`:''}${s.flow?`<div class="flow">${s.flow.map(renderFlow).join('')}</div>`:''}${s.cards?`<div class="grid">${s.cards.map(renderCard).join('')}</div>`:''}${s.note?`<div class="note">${esc(s.note)}</div>`:''}${s.callout?`<div class="callout">${esc(s.callout)}</div>`:''}</div></div>`}
el.insertAdjacentHTML('beforeend',`<div class="footer"><span>TWINI · IDTC &nbsp; | &nbsp; PAPARAN MATERI SIMULASI DIGITAL TWIN</span><span>${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span></div>`);deck.appendChild(el)}
let current=0;const all=[...document.querySelectorAll('.slide')];function show(n){current=(n+all.length)%all.length;all.forEach((s,i)=>s.classList.toggle('active',i===current));document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${String(all.length).padStart(2,'0')}`;history.replaceState(null,'',`#slide-${current+1}`)}function move(d){show(current+d)}document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key==='Home')show(0);if(e.key==='End')show(all.length-1)});show(0);
</script>
</body>
</html>
