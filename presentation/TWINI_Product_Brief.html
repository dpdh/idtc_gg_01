<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TWINI — Product Brief</title>
<style>
:root{--bg:#07111f;--surface:#10243a;--surface2:#15314d;--text:#f3f8ff;--muted:#afc2d7;--cyan:#7dd3fc;--mint:#7be0c0;--gold:#ffd166;--line:rgba(165,210,245,.23)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.deck{height:100vh;width:100vw;position:relative}.slide{display:none;position:absolute;inset:0;padding:6vh 6vw 7vh;overflow:auto;background:radial-gradient(circle at 90% 0%,#173957 0,transparent 38%),linear-gradient(140deg,#07111f,#0a1829 70%,#0b2032)}.slide.active{display:flex;flex-direction:column}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.title{font-size:clamp(32px,5vw,70px);line-height:1.02;letter-spacing:-.04em;max-width:980px;margin:16px 0 18px}.lead{font-size:clamp(17px,1.8vw,26px);line-height:1.45;color:var(--muted);max-width:900px}.cover{justify-content:center}.cover .title{font-size:clamp(62px,10vw,142px);margin:20px 0 14px}.cover .lead{font-size:clamp(20px,2.3vw,32px)}.mark{display:flex;gap:12px;align-items:center;color:var(--mint);font-weight:800;letter-spacing:.2em}.mark i{width:52px;height:3px;background:var(--mint);display:block}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:32px}.chip{padding:10px 15px;border:1px solid var(--line);background:rgba(25,52,78,.65);border-radius:99px;color:#d9edff;font-size:14px}.content{display:flex;gap:5vw;align-items:center;flex:1;min-height:0}.copy{flex:1;min-width:0}.copy h2{font-size:clamp(21px,2.3vw,34px);color:var(--cyan);margin:0 0 12px}.copy p,.copy li{font-size:clamp(15px,1.35vw,20px);line-height:1.5;color:var(--muted)}.copy ul{padding-left:1.15em}.visual{width:min(31vw,390px);height:min(68vh,660px);flex:0 0 auto;padding:9px;border:1px solid rgba(173,215,244,.4);border-radius:26px;background:#081321;box-shadow:0 22px 70px rgba(0,0,0,.4)}.visual img{width:100%;height:100%;object-fit:contain;border-radius:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px}.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(22,48,75,.92),rgba(12,30,49,.92))}.card b{display:block;color:var(--mint);font-size:clamp(15px,1.35vw,20px);margin-bottom:7px}.card span{display:block;color:var(--muted);font-size:clamp(13px,1.15vw,17px);line-height:1.42}.metric{display:flex;gap:16px;align-items:stretch;margin:25px 0}.metric .card{flex:1}.metric strong{display:block;font-size:clamp(31px,4vw,58px);color:var(--gold);line-height:1}.metric small{display:block;color:var(--muted);font-size:14px;margin-top:9px}.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:25px}.phase{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-height:190px}.phase .tag{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.1em}.phase h3{font-size:20px;margin:12px 0 8px}.phase p{font-size:14px;color:var(--muted);line-height:1.45}.callout{margin-top:18px;padding:15px 18px;border-left:4px solid var(--gold);background:rgba(255,209,102,.1);border-radius:0 12px 12px 0;color:#e9f4ff;line-height:1.45}.footer{position:absolute;bottom:2.2vh;left:6vw;right:6vw;display:flex;justify-content:space-between;color:#7891a8;font-size:11px;letter-spacing:.08em}.controls{position:fixed;z-index:20;right:3vw;bottom:2vh;display:flex;gap:8px}.controls button{width:42px;height:42px;border:1px solid #4b6985;border-radius:50%;background:#142a40;color:#fff;font-size:21px;cursor:pointer}.counter{position:fixed;right:3vw;top:2vh;color:#91abc3;font-size:12px;letter-spacing:.13em}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.flow article{padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}.flow .num{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.13em}.flow h3{margin:13px 0 7px;font-size:20px}.flow p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}@media(max-width:850px){.slide{padding:4vh 5vw 9vh}.content{align-items:flex-start;gap:16px}.visual{width:34vw;height:55vh}.grid{grid-template-columns:1fr;gap:8px}.roadmap{grid-template-columns:repeat(2,1fr)}.flow{gap:8px}.flow article{padding:13px}.copy p,.copy li{font-size:14px}}@media print{html,body{overflow:visible}.slide{display:flex!important;position:relative;page-break-after:always;height:100vh}.controls,.counter{display:none}}
</style>
</head>
<body>
<main class="deck" id="deck"></main><div class="counter" id="counter"></div><div class="controls"><button onclick="move(-1)" aria-label="Sebelumnya">‹</button><button onclick="move(1)" aria-label="Berikutnya">›</button></div>
<script>
const base='screenshots/';
const slides=[
 {cover:1,eyebrow:'INDONESIA DIGITAL TWIN COMMUNITY',title:'TWINI',lead:'Game edukasi Digital Twin yang mengubah kawasan Monas menjadi ruang eksplorasi, simulasi, dan pembelajaran interaktif.',chips:['Product brief','Digital Twin','Game edukasi','Monas · Jakarta']},
 {title:'Mengapa TWINI?',lead:'TWINI menjembatani konsep Digital Twin yang kompleks dengan pengalaman bermain yang mudah dipahami.',cards:[['Lihat kota sebagai model','Pemain mengenali landmark, taman, jalan, bangunan, sensor, dan karakter sebagai entitas digital.'],['Belajar lewat aksi','Bergerak, menemukan, mengaktifkan sensor, mengelola energi, dan melihat perubahan state.'],['Bangun skenario','City Builder membuka ruang untuk menyusun aset kota dan merancang skenario sensor.'],['Refleksi data','Dashboard memperkenalkan telemetri, status perangkat, waktu, lokasi, dan kualitas data.']]},
 {title:'Pengalaman produk saat ini',image:'home_dashboard_actual.png',cards:[['Home','Pintu masuk dengan identitas TWINI, carousel model 3D, dan navigasi utama.'],['Explore','Koleksi aset 3D untuk mengenal karakter serta objek kota.'],['TWINI','Masuk ke game survival dan eksplorasi kawasan Monas.'],['Simulasi','Area untuk proyek simulasi dan pengembangan model digital.']],callout:'Screenshot aktual web preview. Visual utama memperkuat identitas TWINI sebagai produk yang visual, interaktif, dan berorientasi eksplorasi.'},
 {title:'Gameplay · belajar melalui eksplorasi',image:'gameplay.png',cards:[['Gerak natural','Joystick mengarahkan karakter maju sesuai arah input; kamera dibuat lebih dekat agar orientasi terasa jelas.'],['Kontrol transparan','Navigator joystick dan action button dibuat transparan supaya tidak menutup peta dan area bermain.'],['Aksi karakter','Run, Jump, Interact, Dash, dan Back menjadi bahasa interaksi yang mudah dipahami.'],['Dunia Monas','Area diperluas dengan pepohonan, kolam, tempat olahraga, landmark, dan jaringan jalan terpilih.']]},
 {title:'Karakter, progres, dan motivasi',image:'characters.png',cards:[['Avatar 3D','Pilihan model GLB memberi identitas dan variasi karakter.'],['Misi','Eksplorasi landmark, aktivasi sensor, pengumpulan item, dan survival time.'],['Resource','Health, energy, stamina, dan battery membentuk trade-off dalam bermain.'],['Reward','XP, coins, item, dan progres membuat sesi eksplorasi terasa bertahap.']]},
 {title:'Dari peta menjadi Digital Twin',flow:[['01 · REPRESENTASI','Peta kawasan Monas, objek 3D, landmark, jalan, taman, dan bangunan.'],['02 · STATE','Posisi avatar, sensor, resource, misi, waktu, dan status perangkat.'],['03 · INTERAKSI','Pemain melakukan aksi; event mengubah state dan memberi umpan balik.']],callout:'Nilai utama TWINI adalah membuat hubungan antara ruang, objek, data, aturan, dan tindakan terasa konkret.'},
 {title:'City Builder · ruang untuk merancang skenario',image:'city_builder.png',cards:[['Grid level','Susun aset pada area terstruktur untuk membuat skenario eksplorasi.'],['Aset kota','Tempatkan bangunan, fasilitas, pohon, lampu, dan landmark.'],['Sensor IoT','Pilih perangkat untuk skenario banjir, kualitas udara, dan energi.'],['Eksperimen','Bandingkan penempatan aset dan sensor dengan dampaknya pada misi.']]},
 {title:'Dashboard · data yang bisa dibaca pemain',image:'telemetry.png',cards:[['Telemetri simulasi','Suhu, kelembapan, AQI, angin, dan status perangkat menjadi umpan balik.'],['Konteks lokasi','Setiap sensor perlu memiliki ID, koordinat, satuan, dan waktu pembaruan.'],['Kejujuran data','Nilai prototipe harus diberi label simulasi sampai tersambung ke sumber resmi.'],['Langkah berikutnya','Tambahkan provenance, histori, validasi, dan mode replay.']]},
 {title:'Inventory · keputusan kecil yang terasa',image:'inventory.png',cards:[['Pemulihan','Energy Crystal, Battery Pack, dan Health Kit mendukung strategi pemain.'],['Trade-off','Pemain memilih kapan berlari, menjelajah, atau menyimpan resource.'],['Peluang belajar','Resource game dapat menjadi analogi sederhana untuk kapasitas dan konsumsi sistem.']]},
 {title:'Roadmap pengembangan TWINI',roadmap:[['FASE 1 · 0–3 BULAN','Core gameplay','Poles kontrol sentuh, collision, kamera, onboarding, save progress, dan performa mobile.'],['FASE 2 · 3–6 BULAN','Monas hidup','Tambah landmark tervalidasi, POI, kolam, olahraga, event cuaca, dan quest berbasis lokasi.'],['FASE 3 · 6–12 BULAN','Data terhubung','Integrasi feed resmi, timestamp, histori telemetri, sensor simulator, dan replay skenario.'],['FASE 4 · 12+ BULAN','Ekosistem','Multiplayer kelas, authoring skenario, SDK aset, analytics, dan deployment institusi.']]},
 {title:'Prioritas teknis dan produk',metric:[['01','Kenyamanan mobile','Kontrol stabil di web view, Android, dan iOS.'],['02','Kredibilitas data','Bedakan data simulasi, data referensi, dan data live.'],['03','Skalabilitas scene','Optimasi GLB, LOD, batching, dan streaming area.']],cards:[['KPI pengalaman','Session completion, waktu eksplorasi, misi selesai, crash-free session.'],['KPI pembelajaran','Pemahaman entitas-state-event dan kemampuan menyusun skenario sensor.'],['KPI platform','FPS, waktu load, ukuran asset, dan latensi update data.']]},
 {title:'Risiko dan cara mengelolanya',cards:[['Performa mobile','Gunakan LOD, kompresi GLB, culling, dan asset loading bertahap.'],['Akurasi peta','Gunakan sumber resmi, metadata, provenance, dan review geospasial.'],['Kebingungan pemain','Perkuat onboarding, legenda map, ikon konsisten, dan feedback aksi.'],['Data sensitif','Terapkan akun demo, minimisasi data, dan kebijakan privasi sejak awal.']]},
 {cover:1,eyebrow:'NEXT STEP',title:'Bangun kota yang bisa dipahami',lead:'TWINI dimulai sebagai game. Arah pengembangannya adalah menjadi laboratorium Digital Twin yang dapat dimainkan, diuji, dan dipercaya.',chips:['Poles gameplay','Perluas Monas','Hubungkan data','Ukur pembelajaran']}
];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(x){return `<div class="card"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`}
function flow(x,i){return `<article><div class="num">${esc(x[0])}</div><h3>${esc(x[1])}</h3><p>${esc(x[2])}</p></article>`}
function phase(x){return `<div class="phase"><div class="tag">${esc(x[0])}</div><h3>${esc(x[1])}</h3><p>${esc(x[2])}</p></div>`}
function metrics(x){return `<div class="metric">${x.map(v=>`<div class="card"><strong>${esc(v[0])}</strong><b>${esc(v[1])}</b><small>${esc(v[2])}</small></div>`).join('')}</div>`}
const deck=document.getElementById('deck');
slides.forEach((s,i)=>{const e=document.createElement('section');e.className='slide'+(i===0?' active':'');if(s.cover){e.classList.add('cover');e.innerHTML=`<div class="mark"><i></i>${esc(s.eyebrow)}</div><h1 class="title">${esc(s.title)}</h1><div class="lead">${esc(s.lead)}</div><div class="chips">${s.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`}else{e.innerHTML=`<div class="eyebrow">TWINI · IDTC / PRODUCT BRIEF</div><h1 class="title">${esc(s.title)}</h1><div class="content">${s.image?`<div class="visual"><img src="${base+esc(s.image)}" alt="${esc(s.title)}"></div>`:''}<div class="copy">${s.lead?`<p class="lead">${esc(s.lead)}</p>`:''}${s.flow?`<div class="flow">${s.flow.map(flow).join('')}</div>`:''}${s.roadmap?`<div class="roadmap">${s.roadmap.map(phase).join('')}</div>`:''}${s.metric?metrics(s.metric):''}${s.cards?`<div class="grid">${s.cards.map(card).join('')}</div>`:''}${s.callout?`<div class="callout">${esc(s.callout)}</div>`:''}</div></div>`}e.insertAdjacentHTML('beforeend',`<div class="footer"><span>TWINI · IDTC</span><span>${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</span></div>`);deck.appendChild(e)});
const all=[...document.querySelectorAll('.slide')];let current=0;function show(n){current=(n+all.length)%all.length;all.forEach((x,i)=>x.classList.toggle('active',i===current));document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${String(all.length).padStart(2,'0')}`;history.replaceState(null,'',`#slide-${current+1}`)}function move(d){show(current+d)}document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key==='Home')show(0);if(e.key==='End')show(all.length-1)});show(0);
</script>
</body>
</html>
